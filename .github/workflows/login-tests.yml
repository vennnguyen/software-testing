name: Login Tests CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-login:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Setup Java
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Make Maven wrapper executable
        run: chmod +x ./backend/mvnw

      - name: Start Backend in Background (Port 8080)
        run: |
          cd backend
          ./mvnw spring-boot:run &
          sleep 20

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "18"

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Run Login Unit Tests
        run: |
          cd frontend
          npm test -- --coverage --testPathPatterns Login

      - name: Start Frontend in Background (Port 5173)
        run: |
          cd frontend
          npm run build
          npm install -g serve
          serve -s dist -l 5173 &
          sleep 10

      - name: Run Login E2E Tests
        run: |
          cd frontend
          npm run test:e2e:spec -- "cypress/e2e/login.cy.js"
        env:
          BASE_URL: http://localhost:5173

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: frontend/reports/

